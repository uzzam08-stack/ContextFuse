services:
  # ─── ContextFuse FastAPI Backend Web Service ──────────────────────────────
  - type: web
    name: contextfuse-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: DECIDER_BASE_URL
        value: http://localhost:11434
      - key: AWS_REGION
        value: us-east-1
      - key: DYNAMODB_TABLE_NAME
        value: contextfuse-runs

  # ─── ContextFuse Vite/React Frontend Static Site ─────────────────────────
  - type: web
    name: contextfuse-ui
    runtime: static
    region: oregon
    plan: free
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://contextfuse-api.onrender.com
